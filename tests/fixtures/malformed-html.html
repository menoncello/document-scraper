<!DOCTYPE html>
<html>
<head>
    <title>Malformed HTML Test
    <meta charset="UTF-8">
</head>
<body>
    <div id="container">
        <h1>Test Page with Malformed HTML
        <p>This paragraph is not closed
        <div class="nested">
            <span class="highlight">Unclosed span
            <img src="test.jpg" alt="Image without self-closing">
        <p>Another paragraph
        <ul>
            <li>Item 1
            <li>Item 2
            <li>Item 3
        </div>
        <table>
            <tr>
                <td>Cell 1
                <td>Cell 2
            <tr>
                <td>Cell 3
                <td>Cell 4
        </table>
    <div class="mixed-content">
        <section>
            <article>
                <h2>Article Title</h2>
                <p>Article content with <strong>bold text</em> mismatched tags
            </article>
        </section>
    </div>
</body>
