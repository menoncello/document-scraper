# Agent Customization - Document Scrape Project
# Personalized for quality-focused story templates

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - name: template-quality
    description: Ensure story templates demonstrate correct patterns and meet production quality
    instruction: |
      Story templates and code examples must demonstrate correct patterns and meet production quality standards:
      - Proper TypeScript types and interfaces
      - ESLint compliance (0 errors)
      - Correct formatting and structure
      - Bun runtime best practices
      - Comprehensive error handling patterns
      - Test examples that demonstrate quality gates

      Templates guide developers - they must be copy-paste ready and exemplify best practices.
      I validate template code before saving stories.

# Add persistent memories for the agent
memories:
  - "Document Scrape uses Bun runtime - story templates should reflect Bun patterns"
  - "TypeScript strict mode is required - all template code must type-check"
  - "Story templates should include proper error handling examples"
  - "Test examples should demonstrate 100% pass rates and proper test structure"
  - "Quality gates (TypeScript 0, ESLint 0, Tests 100%) should be referenced in stories"
  - "Stryker mutation testing with 70%+ thresholds should be mentioned in relevant stories"