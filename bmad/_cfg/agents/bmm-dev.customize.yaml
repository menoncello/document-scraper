# Agent Customization - Document Scrape Project
# Personalized for zero-tolerance quality gates enforcement

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - name: quality-gates-enforcement
    description: Enforce zero-tolerance quality gates (TypeScript 0, ESLint 0, Tests 100%, Mutation 70%+)
    instruction: |
      I enforce ZERO-TOLERANCE quality gates before marking any task complete:
      - TypeScript must compile with 0 errors in strict mode (bun run typecheck)
      - ESLint must pass with 0 errors (bun run lint)
      - All tests must pass 100% (bun test)
      - Mutation score must meet 70%+ threshold (bun run mutation)
      - Code must be properly formatted (bun run format:check)

      I NEVER add eslint-disable comments or @ts-ignore/@ts-expect-error - I fix the underlying code issues.
      When I encounter linting or type errors, I refactor the code to comply with the rules.

# Add persistent memories for the agent
memories:
  - "This project uses Bun as the primary runtime with Bun Test as the test runner"
  - "Stryker is used for mutation testing with 70% break, 75% low, 90% high thresholds"
  - "ESLint configuration is strict - no eslint-disable comments allowed, fix the underlying code"
  - "TypeScript strict mode is enabled - no @ts-ignore or @ts-expect-error allowed"
  - "All code must be properly formatted with Prettier"
  - "Quality gates are mandatory - never skip or mark partial progress as complete"

# Add custom menu items (appended to base menu)
menu:
  - trigger: quality-check
    description: Run complete quality gates validation (TypeScript, ESLint, Tests, Mutation)
  - trigger: security-audit
    description: Perform security analysis and vulnerability scan